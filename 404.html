<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Dat Nguyen Trong</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/datntrong.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/datntrong-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  (function () {
    var theme = localStorage.getItem('theme');
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
    }
  })();
</script>
<style>
  .oops { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 1rem; }
  .oops .code { font: 600 clamp(3rem, 12vw, 6rem)/1 var(--serif); color: var(--accent); }
</style>
</head>
<body>
<main class="wrap oops">
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p class="lede" style="margin-inline:auto">That address does not exist on this site.</p>
  <p><a class="btn" href="/">Back to the homepage</a></p>
</main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="datntrong">
  <title>datntrong</title>
  <defs>
    <clipPath id="badge"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="#f4ece0"/>

    <!-- graduation gown: red stole over navy, white shirt at the neck -->
    <path d="M-1 64c1-10.4 7.2-16.9 17-19.1h32c9.8 2.2 16 8.7 17 19.1Z" fill="#17315f"/>
    <path d="M25.6 45.8 21.2 58.2" stroke="#b23a48" stroke-width="4" stroke-linecap="round"/>
    <path d="M38.4 45.8 42.8 58.2" stroke="#b23a48" stroke-width="4" stroke-linecap="round"/>
    <path d="M26.4 44.4h11.2L32 56.4Z" fill="#f8f5ef"/>

    <!-- neck -->
    <path d="M26.6 35h10.8v11H26.6Z" fill="#dda87c"/>

    <!-- ears -->
    <circle cx="16.6" cy="31" r="3.6" fill="#e8b489"/>
    <circle cx="47.4" cy="31" r="3.6" fill="#e8b489"/>

    <!-- head -->
    <ellipse cx="32" cy="28.8" rx="15.4" ry="16.4" fill="#f0be97"/>

    <!-- hair: cap with a side-swept fringe -->
    <path d="M16.4 28.8C15.2 15.8 22.2 7.8 32 7.8s16.8 8 15.6 21c-1-4.5-3.2-7.3-6.5-8.3-4-1.3-7.7-.2-11.1-2.9-3.2 4.9-8.9 3.6-12.3 6.6-.6.5-1.1 1.7-1.3 4.6Z" fill="#16181e"/>

    <!-- cheeks -->
    <circle cx="20.4" cy="36.2" r="2.9" fill="#e58b74" opacity=".4"/>
    <circle cx="43.6" cy="36.2" r="2.9" fill="#e58b74" opacity=".4"/>

    <!-- round glasses -->
    <g fill="#ffffff" fill-opacity=".26" stroke="#23272e" stroke-width="2.4" stroke-linecap="round">
      <circle cx="23.6" cy="30.6" r="6.6"/>
      <circle cx="40.4" cy="30.6" r="6.6"/>
      <path d="M30.2 30h3.6" fill="none"/>
      <path d="M17 29.2h-2.4M47 29.2h2.4" fill="none"/>
    </g>

    <!-- eyes -->
    <circle cx="23.6" cy="30.8" r="2.2" fill="#1d2027"/>
    <circle cx="40.4" cy="30.8" r="2.2" fill="#1d2027"/>

    <!-- smile -->
    <path d="M25.4 36.8c2.9 6.2 10.3 6.2 13.2 0Z" fill="#c26d5c"/>
    <path d="M26.3 37.3h11.4c-2 2-9.4 2-11.4 0Z" fill="#fff8f2"/>
  </g>
</svg>
